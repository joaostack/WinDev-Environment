"$schema" = 'https://starship.rs/config-schema.json'

palette = 'hacker_neon'

[palettes.hacker_neon]
neon_cyan = '#05d9e8'
neon_pink = '#ff2a6d'
neon_green = '#5af78e'
neon_yellow = '#f5d300'
neon_purple = '#b967ff'
dim = '#6c7086'

format = """
$os$username$hostname$shlvl$sudo\\
$directory$git_branch$git_status\\
$python$nodejs$rust$golang$docker_context\\
$time$cmd_duration\\
$character"""

# Alvo atual (opcional): export TARGET="10.10.10.5"
[env_var.TARGET]
format = "[󰓾 $env_value](bold fg:neon_pink) "
disabled = false

[os]
disabled = false
style = "fg:neon_cyan"
format = '[$symbol ]($style)'

[os.symbols]
Linux = "󰌽"
Kali = "󰣇"
Ubuntu = "󰕈"
Arch = "󰣇"
Debian = "󰣚"

[username]
show_always = true
style_user = "fg:neon_green"
style_root = "bold fg:neon_pink"
format = '[$user]($style)'

[hostname]
ssh_only = false
style = "fg:neon_purple"
format = '@[$hostname]($style) '

[shlvl]
disabled = false
symbol = "↕"
style = "fg:dim"
format = '[$symbol$shlvl]($style) '

[sudo]
style = "fg:neon_yellow"
format = '[󰌾 ]($style)'
disabled = false

[directory]
style = "bold fg:neon_cyan"
format = "[$path]($style) "
truncation_length = 3
truncate_to_repo = true
truncation_symbol = "…/"

[git_branch]
symbol = "󰊢"
style = "fg:neon_purple"
format = '[ $symbol $branch]($style)'

[git_status]
style = "fg:neon_yellow"
format = '[$all_status$ahead_behind]($style) '
conflicted = "!"
ahead = "⇡${count}"
behind = "⇣${count}"
diverged = "⇕⇡${ahead_count}⇣${behind_count}"
untracked = "?"
modified = "*"
staged = "+"
renamed = "»"
deleted = "x"

[python]
symbol = "󰌠"
style = "fg:neon_green"
format = '[ $symbol( $version)(\(#$virtualenv\))]($style)'

[nodejs]
symbol = "󰎙"
style = "fg:neon_green"
format = '[ $symbol( $version)]($style)'

[rust]
symbol = "󱘗"
style = "fg:neon_green"
format = '[ $symbol( $version)]($style)'

[golang]
symbol = "󰟓"
style = "fg:neon_green"
format = '[ $symbol( $version)]($style)'

[docker_context]
symbol = "󰡨"
style = "fg:neon_cyan"
format = '[ $symbol( $context)]($style)'

[time]
disabled = false
time_format = "%R"
style = "fg:dim"
format = '[󱑎 $time]($style) '

[cmd_duration]
min_time = 0
style = "fg:neon_yellow"
format = '[󱎫 $duration]($style) '

[character]
success_symbol = '[❯](bold fg:neon_green)'
error_symbol = '[❯](bold fg:neon_pink)'
vimcmd_symbol = '[❮](bold fg:neon_yellow)'
