linux_display_server x11

foreground #eaeaea
background #0a0a0a
cursor #00ff9c
cursor_text_color #0a0a0a

selection_background #222222
selection_foreground #ffffff

background_opacity 0.96

font_family family="Hurmit Nerd Font"
bold_font auto
italic_font auto
bold_italic_font auto
font_size 15.0

cursor_shape block
cursor_blink_interval 0.5
cursor_stop_blinking_after 10.0
cursor_trail 1

remember_window_size no
initial_window_width 1600
initial_window_height 900
window_margin_width 8

scrollback_lines 15000

tab_bar_style powerline
tab_powerline_style slanted

active_tab_foreground #00ff9c
active_tab_background #111111
active_tab_font_style bold

inactive_tab_foreground #555555
inactive_tab_background #1a1a1a
inactive_tab_font_style normal

allow_remote_control yes
shell_integration no-cursor
confirm_os_window_close 1

map ctrl+shift+t new_tab_with_cwd
map ctrl+shift+w close_tab
map f1 clear_terminal reset active

color0  #0a0a0a
color8  #333333

color1  #ff003c
color9  #ff335c

color2  #00ff9c
color10 #33ffb5

color3  #ffcc00
color11 #ffd633

color4  #4cc2ff
color12 #80d4ff

color5  #b366ff
color13 #cc99ff

color6  #00e5ff
color14 #66f2ff

color7  #cccccc
color15 #ffffff
